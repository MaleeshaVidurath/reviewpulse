[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewpulse"
version = "0.1.0"
description = "Customer Review Triage & Aggregation agent (Strands Agents SDK)"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "strands-agents",
    "strands-agents-tools",
    "bedrock-agentcore",
    "boto3",
    # The `aws login` browser credential provider is only readable by
    # botocore with the CRT auth signer installed -- without this extra,
    # every Bedrock call fails with MissingDependencyException even though
    # `aws sts get-caller-identity` works fine from the CLI.
    "botocore[crt]",
    "pydantic",
    "requests",
    "python-dotenv",
]

[tool.setuptools.packages.find]
include = ["reviewpulse*"]
